<!doctype html>

  <head>

    <style>
      html, body { margin: 0; height: 100%; background: #141a2c; overflow: hidden; }
      body { display: grid; place-items: center; font-family: Nunito, system-ui, sans-serif; }
      #l1, #l2, button, .name, .ready, .wallet, #hats, .own { font-family: Fredoka, system-ui, sans-serif !important; }
      canvas { display: block; image-rendering: auto; cursor: crosshair; }
      #porch {
        position: fixed; inset: 0; display: grid; place-items: center;

        backdrop-filter: blur(2px);
      }
      #porch.hidden { display: none; }

      /* every button identical: the choice must not be nudged (QA #24) */
      #btns button {

      #btns button:hover, #btns button:focus-visible { background: #fff1dc; outline: 3px solid #fff; outline-offset: 2px; }
      #btns button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b98a5a; }
      #garage.hidden { display: none; }
      #garage { margin: -12px auto 28px; max-width: 980px; }

      .shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; text-align: left; }
      .item { background: rgba(255, 246, 234, 0.1); border: 1px solid rgba(255, 230, 200, 0.25); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

      .item .name { font-weight: 800; font-size: 16px; }
      .item .blurb { font-size: 13px; color: #f0e2d2; flex: 1; line-height: 1.35; }
      .item .blurb i { color: #f7c999; }

      .item .own { font: 700 13px system-ui, sans-serif; color: #f7c999; padding: 9px 0 6px; text-align: center; }
      .ready { font-size: 24px; font-weight: 800; margin-bottom: 6px; color: #fff6ea; }
      .who { font-size: 13px; color: #e8d6c2; margin-top: 10px; }
      #hats { margin: -20px 0 28px; font-size: 18px; font-weight: 700; color: #f3d9bd; display: flex; gap: 10px; align-items: center; justify-content: center; }
      #hats.hidden { display: none; }
      #hats svg { width: 34px; height: 26px; }

      /* ---------------- title: a live demo match plays behind the logo ---------------- */
      #title {
        position: fixed; left: 50%; top: 50%; width: var(--cw, 100vw); height: var(--ch, 100vh); transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        padding: calc(var(--ch, 100vh) * 0.07) 0 calc(var(--ch, 100vh) * 0.06); box-sizing: border-box; pointer-events: none; font-family: Fredoka, system-ui, sans-serif; color: #fff6ea;
        background:
          radial-gradient(ellipse 70% 42% at 50% 22%, rgba(255, 214, 160, 0.38), rgba(255, 214, 160, 0) 70%),
          linear-gradient(to bottom, rgba(24, 30, 58, 0.5), rgba(24, 30, 58, 0) 38%, rgba(24, 30, 58, 0) 62%, rgba(24, 30, 58, 0.62));
        transition: opacity 0.6s ease;
      }
      #title.hidden { opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0s linear 0.5s; }
      #title .kicker { font-weight: 600; font-size: calc(var(--cw, 100vw) * 0.0145); letter-spacing: 0.32em; text-transform: uppercase; color: #ffe2bf; text-shadow: 0 2px 6px rgba(20, 20, 50, 0.5); margin-bottom: 0.3em; }
      .logo { display: flex; gap: 0.06em; font-weight: 700; font-size: calc(var(--cw, 100vw) * 0.105); line-height: 1; letter-spacing: 0.01em; animation: bob 4s ease-in-out infinite; }
      .logo .gap { width: 0.32em; }
      .logo span.l {
        position: relative; display: inline-block; color: #f08440;
        background: linear-gradient(#ffa25e, #e0682c 70%, #c4542a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 0.045em #5c2a14; paint-order: stroke fill;
        filter: drop-shadow(0 0.055em 0 #7a3313) drop-shadow(0 0.1em 0.12em rgba(20, 20, 50, 0.45));
        transform: rotate(var(--r, 0deg)) translateY(var(--y, 0));
      }
      .logo span.l::before {
        /* a cap of snow on every letter */
        content: ""; position: absolute; left: var(--cl, 4%); right: var(--cr, 4%); top: calc(0.1em - var(--sh, 0.17em) + 0.17em); height: var(--sh, 0.17em);
        background: radial-gradient(ellipse 30% 70% at var(--lump, 30%) 10%, #fff 60%, transparent 62%) 0 -0.04em / 100% 100% no-repeat, #ffffff;
        border-radius: 0.12em 0.14em 0.07em 0.09em / 0.12em 0.1em 0.1em 0.12em;
        box-shadow: inset 0 -0.03em 0 #cfdcf2, 0 0.015em 0 rgba(92, 42, 20, 0.6);
        -webkit-text-fill-color: initial; z-index: 1;
      }
      .logo span.l::after {
        /* ...and a drip */
        content: ""; position: absolute; left: var(--dx, 60%); top: 0.22em; width: 0.07em; height: var(--dh, 0.1em);
        background: #ffffff; border-radius: 0 0 0.05em 0.05em; z-index: 1;
      }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      #title .tag { margin: 0.9em 0 0; padding: 0.45em 1.3em; border-radius: 999px; background: rgba(28, 32, 62, 0.42); backdrop-filter: blur(3px); font-family: Nunito, system-ui, sans-serif; font-weight: 700; font-size: calc(var(--cw, 100vw) * 0.0135); color: #fff6ea; text-shadow: 0 1px 4px rgba(20, 20, 50, 0.6); text-align: center; line-height: 1.5; }
      #title .tag b { color: #ffd2a6; }
      #title .bottom { display: flex; flex-direction: column; align-items: center; gap: 18px; pointer-events: auto; }
      #title button {
        font: 700 calc(var(--cw, 100vw) * 0.019) Fredoka, system-ui, sans-serif; color: #2a1d14; background: #fbe6c8;
        border: 0; border-radius: 16px; padding: 0.55em 1.6em; cursor: pointer; box-shadow: 0 5px 0 #b98a5a, 0 10px 24px rgba(20, 20, 50, 0.35);
        animation: breathe 2.4s ease-in-out infinite;
      }
      #title button:hover, #title button:focus-visible { background: #fff1dc; outline: 3px solid #fff; outline-offset: 3px; }
      #title button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98a5a; }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
      #title .controls { display: flex; gap: 1.6em; font-family: Nunito, system-ui, sans-serif; font-weight: 700; font-size: calc(var(--cw, 100vw) * 0.0105); color: #f3e4d4; text-shadow: 0 1px 3px rgba(20, 20, 50, 0.7); }
      #title .controls kbd { font: 700 0.85em Fredoka, system-ui, sans-serif; background: rgba(255, 246, 234, 0.16); border: 1px solid rgba(255, 246, 234, 0.4); border-radius: 6px; padding: 2px 7px; margin-right: 6px; color: #fff; }
    </style>

      <div class="card">
